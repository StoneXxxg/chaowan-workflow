<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮玩盲盒工作流</title><style>body{font:16px Arial;max-width:900px;margin:30px auto;padding:0 18px;color:#242334}input,select,button,textarea{font:inherit;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}select,input{width:30%}button{background:#6656e8;color:#fff;border:0;cursor:pointer;width:100%}.box{padding:20px;border:1px solid #e5e3ef;border-radius:14px;margin:14px 0}pre{white-space:pre-wrap;line-height:1.7}.ok{color:#087f5b}.err{color:#c33}</style><body><h1>潮玩盲盒工作流</h1><div class="box"><h2>识别与选择</h2><input id="ip" placeholder="IP名称"><input id="series" placeholder="系列名称"><input id="style" placeholder="款式（可选）"><input id="shot" type="file" accept="image/*"><div id="ocr"></div><select id="ips"><option>选择IP</option><option>Hirono｜小野</option><option>Skullpanda｜斯卡潘</option><option>THE MONSTERS / Labubu｜拉布布</option><option>Molly｜Molly</option><option>Dimoo｜Dimoo</option><option>Crybaby｜哭娃</option><option>Sweet Bean｜甜豆</option><option>Pucky｜Pucky</option><option>HACIPUPU｜哈基波波</option><option>Twinkle Twinkle｜星星人</option><option>Azura｜阿祖拉</option><option>Peach Riot｜桃气暴击</option></select><select id="seriesList"><option>选择系列</option></select><button id="research">搜索并总结中文手感 →</button><div id="msg"></div></div><div class="box"><h2>手感总结</h2><pre id="summary">等待搜索</pre><details><summary>查看参考来源</summary><div id="sources"></div></details></div><div class="box"><h2>可修改攻略</h2><input value="盲盒手感攻略｜热门与隐藏款" style="width:100%"><textarea rows="8" style="width:100%">请根据上面的手感总结修改攻略。</textarea><input value="#盲盒 #潮玩 #手感攻略" style="width:100%"></div><script>const API=location.hostname==='localhost'||location.hostname==='127.0.0.1'?'':'https://chaowan-workflow-api.onrender.com',D={'Hirono｜小野':['Hirono After Dark｜暗场系列','Hirono Road Journal｜公路日志系列','Hirono The Other One｜另一个我系列','Hirono Echo｜回声系列','Hirono Reshape｜重塑系列'],'Skullpanda｜斯卡潘':['SKULLPANDA The Paradox｜悖论系列','SKULLPANDA The Feast Begins｜盛宴系列','SKULLPANDA Petals in Four Acts｜四幕花系列','SKULLPANDA Off Mode｜关机系列'],'THE MONSTERS / Labubu｜拉布布':['Big into Energy｜能量系列','Have a Seat｜坐坐系列','Hair Salon｜理发店系列','Pin for Love｜心动系列','Exciting Macaron｜惊喜马卡龙系列'],'Molly｜Molly':['Molly Retro｜复古系列','Molly Zodiac｜生肖系列','Molly The Powerpuff Girls｜飞天小女警系列','Molly Have a Seat｜坐坐系列'],'Dimoo｜Dimoo':['Dimoo We Are Twinkle Twinkle｜闪闪系列','Dimoo Animal Kingdom｜动物王国系列','Dimoo No One Knows｜无人知晓系列'],'Crybaby｜哭娃':['Crybaby Crying Again｜再哭一次系列','Crybaby Powerpuff Girls｜飞天小女警系列'],'Sweet Bean｜甜豆':['Sweet Bean School Diary｜校园日记系列','Sweet Bean Hangout｜出门玩系列'],'Pucky｜Pucky':['Pucky Roly Poly｜滚滚系列','Pucky The Feast｜盛宴系列'],'HACIPUPU｜哈基波波':['HACIPUPU Be A Little Dinosaur｜小恐龙系列','HACIPUPU Have a Seat｜坐坐系列'],'Twinkle Twinkle｜星星人':['Twinkle Twinkle Into The Woods｜森林系列','Twinkle Twinkle Little Prince｜小王子系列','Twinkle Twinkle Sweet Dream｜甜梦系列','Twinkle Twinkle Candy Party｜糖果派对系列','Twinkle Twinkle Wonderland｜梦幻乐园系列'],'Azura｜阿祖拉':['Azura The Little Painter｜小画家系列','Azura A Day of Happiness｜幸福一天系列'],'Peach Riot｜桃气暴击':['Peach Riot Sweetheart｜甜心系列','Peach Riot Neon Carnival｜霓虹嘉年华系列']},$=x=>document.getElementById(x),ss=$('seriesList');$('ips').onchange=e=>{ss.innerHTML='<option>选择系列</option>';(D[e.target.value]||[]).forEach(x=>ss.add(new Option(x,x)));$('ip').value=e.target.value.split('｜')[0]};ss.onchange=e=>$('series').value=e.target.value;async function j(r){let t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('后端返回不是JSON')}};$('shot').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('ocr').textContent='正在OCR…';try{let a=new Uint8Array(await f.arrayBuffer()),s='';a.forEach(x=>s+=String.fromCharCode(x));let r=await fetch(API+'/api/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image_base64:btoa(s),mime_type:f.type})}),d=await j(r);if(!r.ok)throw Error(d.message||d.error);$('ip').value=d.result.ip||'';$('series').value=d.result.series||'';$('style').value=d.result.style||'';$('ocr').className='ok';$('ocr').textContent='✓ OCR完成'}catch(x){$('ocr').className='err';$('ocr').textContent=x.message}};$('research').onclick=async()=>{if(!$('ip').value||!$('series').value){$('msg').className='err';$('msg').textContent='请先选择IP和系列';return}$('msg').textContent='正在检索并生成总结…';try{let r=await fetch(API+'/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ip:$('ip').value,series:$('series').value,max_results:10})}),d=await j(r);if(!r.ok)throw Error(d.message||d.error);$('summary').textContent=d.summary||'本次未生成总结，请重试';$('sources').innerHTML=(d.results||[]).map(x=>'<p><a target="_blank" href="'+x.url+'">'+x.title+'</a></p>').join('');$('msg').className='ok';$('msg').textContent='✓ 已完成中文资料总结'}catch(x){$('msg').className='err';$('msg').textContent=x.message}};</script></body></html>
